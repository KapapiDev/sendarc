name: Installer release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for dry-run (e.g. 3.0.0-rc.1). Ignored on tag-push runs.'
        required: false
        default: '0.0.0-dev'
      dry_run:
        description: 'Dry run — build + sign but do not publish GitHub release'
        required: false
        default: 'false'

# D-27 release pipeline. Tag-triggered on v* (e.g. v3.0.0). Produces a
# versioned SendArc installer and attaches it to the GitHub Release. The installer remains
# explicitly unsigned when the optional SignPath credentials are absent.
#
# SignPath is gated on secrets.SIGNPATH_API_TOKEN (D-24) — if empty, the pipeline
# publishes unsigned. Required SignPath secrets: SIGNPATH_API_TOKEN, SIGNPATH_ORG_ID,
# SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG.
#
# OAuth credentials (SENDARC_OAUTH_CLIENT_ID, SENDARC_OAUTH_CLIENT_SECRET) come from repo
# secrets set during Phase 8 (D-09) and injected via ldflags.

permissions:
  contents: write       # softprops/action-gh-release@v2 release asset upload
  actions:  read        # SignPath v2 reads upload-artifact output

jobs:
  release:
    name: Build + optional sign + publish installer
    runs-on: windows-2025

    env:
      SENDARC_OAUTH_CLIENT_ID:     ${{ secrets.SENDARC_OAUTH_CLIENT_ID }}
      SENDARC_OAUTH_CLIENT_SECRET: ${{ secrets.SENDARC_OAUTH_CLIENT_SECRET }}
      HAS_SIGNPATH:               ${{ secrets.SIGNPATH_API_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install mingw-mstorsjo-llvm-ucrt (interceptor build toolchain)
        shell: pwsh
        run: |
          # build.ps1 (since QUICK-260423-ntu) requires the triple-prefixed clang driver
          # from scoop's mingw-mstorsjo-llvm-ucrt package — choco's mingw uses a different
          # driver layout and is unusable for our x64 + x86 dual build. The package also
          # bundles cmake + ninja, so no separate cmake/ninja install is needed here.
          Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy RemoteSigned -Force
          # windows-2025 pwsh sessions run elevated (as runneradmin); scoop's installer
          # aborts under elevation unless SCOOP_INSTALL_AS_ADMIN=1 is set (or -RunAsAdmin
          # is passed). Setting the env var is a no-op when non-elevated and clears the
          # gate when elevated, so it's safe in both modes.
          $env:SCOOP_INSTALL_AS_ADMIN = "1"
          Invoke-WebRequest -UseBasicParsing https://get.scoop.sh -OutFile "$env:TEMP\install-scoop.ps1"
          & "$env:TEMP\install-scoop.ps1"
          scoop install mingw-mstorsjo-llvm-ucrt
          if ($LASTEXITCODE -ne 0) { throw "scoop install mingw-mstorsjo-llvm-ucrt failed (exit $LASTEXITCODE)" }
          # Sanity check — fail fast if either triple-prefixed driver is missing.
          # build.ps1 reads from this exact path; it is hardcoded, not PATH-derived.
          $bin = "$env:USERPROFILE\scoop\apps\mingw-mstorsjo-llvm-ucrt\current\bin"
          foreach ($exe in @('x86_64-w64-mingw32-clang.exe','i686-w64-mingw32-clang.exe')) {
            if (-not (Test-Path "$bin\$exe")) { throw "Missing $exe in $bin" }
          }
          Write-Host "scoop mingw-mstorsjo-llvm-ucrt installed:"
          Get-ChildItem "$bin\*-w64-mingw32-clang*.exe" | ForEach-Object { Write-Host "  $($_.Name)" }
          # Persist scoop's shims dir on PATH for subsequent steps (GitHub Actions
          # only auto-propagates system PATH between steps; scoop appends to user
          # PATH, which a fresh pwsh session will not see without this echo).
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install npm workspaces
        run: npm ci

      # D-26: derive the release version from the trigger and patch wails.json
      # in-runner so PE metadata, ldflags, and NSIS all see the same value.
      # The repo's wails.json productVersion is intentionally a placeholder
      # (0.0.0-dev) — the git tag is the sole authority for release version.
      - name: Derive version + patch wails.json
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq 'push') {
            $version = "${{ github.ref_name }}" -replace '^v',''
          } else {
            $version = "${{ inputs.version }}"
          }
          if (-not $version) { throw "Empty version — refusing to build." }

          # Patch wails.json so Wails picks the right value for PE metadata
          # (FileVersion / ProductVersion resources). Ephemeral — not committed.
          $path = 'src/app/wails.json'
          $json = Get-Content $path -Raw | ConvertFrom-Json
          $json.info.productVersion = $version
          $json | ConvertTo-Json -Depth 10 | Set-Content $path -Encoding utf8

          # Surface to downstream steps + detect prerelease (any '-' in the version)
          $isPrerelease = $version -match '-'
          "version=$version"           | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          $preStr = if ($isPrerelease) { 'true' } else { 'false' }
          "prerelease=$preStr"         | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          Write-Host "Release version: $version (prerelease: $preStr)"

      # Phase 11 plan 06 guard: prove this workflow would not ship e2e hooks.
      # Fails fast if '-tags e2e', GOMAPI_DEBUG_BROWSER_ARGS, or any SENDARC_E2E_*
      # marker is present in the build definition.
      - name: Verify release hygiene (no e2e hooks)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-release-hygiene.ps1

      - name: Build frontend
        run: npm --workspace src/app/frontend run build

      - name: Build interceptor DLLs with release version
        shell: pwsh
        env:
          INTERCEPTOR_VERSION: ${{ steps.version.outputs.version }}
        run: |
          .\src\interceptor\build.ps1 -Arch x64 -Config Release -Version $env:INTERCEPTOR_VERSION -Clean
          .\src\interceptor\build.ps1 -Arch x86 -Config Release -Version $env:INTERCEPTOR_VERSION -Clean

      # PATTERNS.md §Shared Pattern 4: all four injectable vars are in `package main`
      # at src/app/. Use -X main.<var>=<value>. CONTEXT D-15's `github.com/marcfargas/go-mapi/src/app`
      # path is wrong and corrected here.
      - name: Build Wails app (release ldflags — all four injections)
        working-directory: src/app
        shell: pwsh
        run: |
          if (-not $env:SENDARC_OAUTH_CLIENT_ID -or -not $env:SENDARC_OAUTH_CLIENT_SECRET) {
            throw "Required SendArc OAuth repository secrets are not configured."
          }
          $ldf = "-X main.Version=${{ steps.version.outputs.version }} -X main.aumidOverride=app.sendarc.desktop -X main.oauthClientID=$env:SENDARC_OAUTH_CLIENT_ID -X main.oauthClientSecret=$env:SENDARC_OAUTH_CLIENT_SECRET"
          # Wails' normal summary prints the full ldflags value. GitHub masks
          # repository secrets, but quiet mode prevents relying on masking.
          wails build -v 0 -platform windows/amd64 -ldflags "$ldf"

      - name: Stage unsigned binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staged | Out-Null
          Copy-Item src/app/build/bin/SendArc.exe staged/
          Copy-Item src/interceptor/build-x64/bin/SendArc.dll staged/SendArc-x64.dll
          Copy-Item src/interceptor/build-x86/bin/SendArc.dll staged/SendArc-x86.dll

      # SignPath v2 (errata: CONTEXT D-23 referenced @v1 — PATTERNS.md §Planner-Facing
      # Correction Log entry 2 mandates @v2).
      - name: Upload binaries for SignPath (pass 1)
        if: ${{ env.HAS_SIGNPATH == 'true' }}
        id: upload-binaries
        uses: actions/upload-artifact@v6
        with:
          name: sendarc-binaries-unsigned
          path: staged/

      - name: SignPath — sign binaries (pass 1 of 2)
        if: ${{ env.HAS_SIGNPATH == 'true' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token:            ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id:      ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug:         ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug:  ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id:   ${{ steps.upload-binaries.outputs.artifact-id }}
          output-artifact-directory: staged-signed
          wait-for-completion:  true

      - name: Replace staged binaries with signed versions
        if: ${{ env.HAS_SIGNPATH == 'true' }}
        shell: pwsh
        run: |
          Copy-Item staged-signed/SendArc.exe src/app/build/bin/SendArc.exe -Force
          Copy-Item staged-signed/SendArc-x64.dll src/interceptor/build-x64/bin/SendArc.dll -Force
          Copy-Item staged-signed/SendArc-x86.dll src/interceptor/build-x86/bin/SendArc.dll -Force

      - name: Install NSIS via scoop (extras bucket)
        shell: pwsh
        run: |
          scoop bucket add extras
          scoop install nsis
          if ($LASTEXITCODE -ne 0) { throw "scoop install nsis failed (exit $LASTEXITCODE)" }
          $nsisVersion = (makensis /VERSION).Trim()
          if ($nsisVersion -ne 'v3.12') { throw "Expected NSIS v3.12, got $nsisVersion; refresh the audited installer inventory before upgrading" }

      - name: Compile installer
        shell: pwsh
        # cwd matters: NSIS resolves ${__FILEDIR__} relative to the script
        # invocation path; running makensis from repo root double-resolves
        # the ..\..\LICENSE include. Match the local `npm run build:installer`
        # convention which cd's into src/installer first, then move the
        # artifact back to repo root for the SignPath upload + release-asset
        # steps that follow.
        run: |
          Push-Location src/installer
          makensis /DSENDARC_VERSION=${{ steps.version.outputs.version }} SendArc.nsi
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "makensis failed (exit $LASTEXITCODE)" }
          Pop-Location
          Move-Item src/installer/SendArc-Setup.exe "SendArc-Setup-${{ steps.version.outputs.version }}.exe" -Force

      - name: Upload installer for SignPath (pass 2)
        if: ${{ env.HAS_SIGNPATH == 'true' }}
        id: upload-installer
        uses: actions/upload-artifact@v6
        with:
          name: sendarc-setup-unsigned
          path: SendArc-Setup-${{ steps.version.outputs.version }}.exe

      - name: SignPath — sign installer (pass 2 of 2)
        if: ${{ env.HAS_SIGNPATH == 'true' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token:            ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id:      ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug:         ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug:  ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id:   ${{ steps.upload-installer.outputs.artifact-id }}
          output-artifact-directory: final
          wait-for-completion:  true

      - name: Resolve final installer path (signed or unsigned)
        id: final
        shell: pwsh
        run: |
          $signed = 'final/SendArc-Setup-${{ steps.version.outputs.version }}.exe'
          $unsigned = 'SendArc-Setup-${{ steps.version.outputs.version }}.exe'
          if (Test-Path $signed) {
            "path=$signed" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
            Write-Host "Using SIGNED installer: $signed"
          } else {
            "path=$unsigned" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
            Write-Host "Using UNSIGNED installer: $unsigned (SIGNPATH_API_TOKEN absent or signing skipped)"
          }

          if (Test-Path $signed) {
            "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          }

      - name: Record signing status
        shell: pwsh
        run: |
          if ('${{ steps.final.outputs.signed }}' -eq 'true') {
            "### Code signing: signed`nSignPath produced the published installer." | Add-Content $env:GITHUB_STEP_SUMMARY
          } else {
            "### Code signing: unsigned beta`nNo signing credential was configured; the beta artifacts are intentionally unsigned." | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          # The beta updater is notify-only. Publish a checksum for the exact
          # versioned installer users download manually from GitHub Releases.
          $assets = @(
            @{ Path = '${{ steps.final.outputs.path }}'; Name = 'SendArc-Setup-${{ steps.version.outputs.version }}.exe' }
          )

          $lines = foreach ($a in $assets) {
            if (-not (Test-Path $a.Path)) {
              throw "SHA256SUMS: missing asset $($a.Path) (expected name $($a.Name))"
            }
            $h = (Get-FileHash -Path $a.Path -Algorithm SHA256).Hash.ToLower()
            "$h  $($a.Name)"
          }

          # ASCII (no BOM) + LF line endings. Set-Content -NoNewline gives no
          # trailing newline; we append one explicitly so the manifest ends with LF.
          $manifest = ($lines -join "`n") + "`n"
          Set-Content -LiteralPath SHA256SUMS.txt -Value $manifest -Encoding ASCII -NoNewline

          Write-Host "Generated SHA256SUMS.txt:"
          Get-Content SHA256SUMS.txt | Write-Host

      - name: Attach installer + SHA256SUMS.txt to GitHub Release
        if: ${{ github.event_name == 'push' && (github.event.inputs.dry_run != 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.final.outputs.path }}
            SHA256SUMS.txt
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
          body_path: .github/release-template.md

      - name: Upload release artifact (workflow_dispatch dry-run debug)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: sendarc-setup-release-${{ github.sha }}
          path: ${{ steps.final.outputs.path }}
          retention-days: 7
