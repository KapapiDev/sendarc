name: Website

on:
  push:
    branches: [main, develop]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Website quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run retention:check
      - run: npm run build
      - run: npm run test:links
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    name: Deploy Cloudflare Pages
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    needs: quality
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        if: ${{ env.HAS_CLOUDFLARE == 'true' }}
        run: npx wrangler pages deploy dist --project-name sendarc --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply privacy migration and deploy retention schedule
        if: ${{ env.HAS_CLOUDFLARE == 'true' }}
        run: |
          npm run db:migrate:remote
          npm run retention:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Record deferred deploy
        if: ${{ env.HAS_CLOUDFLARE != 'true' }}
        run: echo "Cloudflare deploy skipped until repository secrets are configured." >> "$GITHUB_STEP_SUMMARY"
