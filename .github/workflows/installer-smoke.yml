name: Installer smoke test

# Per-PR + develop/main push smoke gate (D-29). Compiles installer end-to-end
# on windows-2025 and round-trips install+uninstall via Pester 5. Blocks
# merges on failure. Path-filtered so doc-only PRs skip the ~3-minute job.
#
# No code signing here (release-only per D-25); dev ldflags only. See
# installer-release.yml (plan 10-06) for the signed-release pipeline.

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/installer/**'
      - 'src/interceptor/**'
      - 'src/app/**'
      - '.github/workflows/installer-smoke.yml'
  pull_request:
    paths:
      - 'src/installer/**'
      - 'src/interceptor/**'
      - 'src/app/**'
      - '.github/workflows/installer-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    name: Build installer + Pester round-trip
    runs-on: windows-2025
    permissions:
      contents: read

    # WR-03: intentionally NO OAuth secret env vars here. Pester does not sign in
    # or exercise OAuth; it launches the app only for the running-process install/
    # uninstall guards. Injecting real OAuth secrets via ldflags would
    # embed production OAuth credentials in the SendArc executable, which then
    # gets bundled into the installer and uploaded as a workflow artifact
    # (retention-days: 7). Artifacts on public repos are read-by-anyone; the
    # release workflow (installer-release.yml) is the only intentional path
    # for publishing a binary that contains the injected secrets.

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install npm workspace dependencies
        run: npm ci

      - name: Build frontend (Svelte 5 - produces src/app/frontend/dist for go:embed)
        run: npm --workspace src/app/frontend run build

      - name: Build interceptor DLLs
        shell: pwsh
        run: |
          .\src\interceptor\build-msvc.ps1 -Arch x64 -Config Release -Version 0.0.0-smoke -Tests -Clean
          .\src\interceptor\build-msvc.ps1 -Arch x86 -Config Release -Version 0.0.0-smoke -Tests -Clean

      - name: Build Wails app (dev ldflags - unsigned, AUMID only, no OAuth secrets)
        working-directory: src/app
        shell: pwsh
        # WR-03: OAuth ldflags intentionally omitted. The smoke harness tests
        # installer behavior, not OAuth. Its process-guard cases may briefly launch
        # the app, but a configured OAuth client is not required for those checks.
        # This keeps real OAuth secrets out of the workflow artifact (which is
        # broadly readable on public repos).
        run: |
          wails build -v 0 -platform windows/amd64 -ldflags "-X main.aumidOverride=app.sendarc.desktop -X main.oauthClientID=ci-placeholder.apps.googleusercontent.com -X main.oauthClientSecret=ci-placeholder"

      - name: Install pinned NSIS via Chocolatey
        shell: pwsh
        run: |
          choco install nsis --version=3.12.0 --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw "choco install nsis failed (exit $LASTEXITCODE)" }
          $nsisExe = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $nsisExe)) { throw "Pinned NSIS executable not found: $nsisExe" }
          Split-Path -Parent $nsisExe | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $nsisVersion = (& $nsisExe /VERSION).Trim()
          if ($nsisVersion -ne 'v3.12') { throw "Expected NSIS v3.12, got $nsisVersion; refresh the audited installer inventory before upgrading" }

      - name: Compile installer
        shell: pwsh
        # cwd matters: NSIS resolves ${__FILEDIR__} relative to the script
        # invocation path; running makensis from repo root double-resolves
        # the ..\..\LICENSE include. Match the local `npm run build:installer`
        # convention which cd's into src/installer first, then move the
        # artifact back to repo root for the existing downstream Test-Path
        # / artifact-upload steps.
        run: |
          Push-Location src/installer
          makensis /DSENDARC_VERSION=0.0.0-smoke SendArc.nsi
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "makensis failed (exit $LASTEXITCODE)" }
          Pop-Location
          Move-Item src/installer/SendArc-Setup.exe SendArc-Setup.exe -Force

      - name: Confirm installer artifact produced
        shell: pwsh
        run: |
          if (-not (Test-Path 'SendArc-Setup.exe')) {
            throw "SendArc-Setup.exe not produced by makensis"
          }
          $size = (Get-Item 'SendArc-Setup.exe').Length
          Write-Host "SendArc-Setup.exe size: $size bytes"

      - name: Install Pester 5
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Pester smoke tests
        shell: pwsh
        env:
          SENDARC_EXPECTED_PRODUCT_VERSION: 0.1.0.0
        run: |
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $config = New-PesterConfiguration
          $config.Run.Path         = 'src/installer/tests/installer.Tests.ps1'
          $config.Run.Exit         = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Upload installer as workflow artifact (for debugging failed runs)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sendarc-setup-smoke-${{ github.sha }}
          path: SendArc-Setup.exe
          if-no-files-found: warn
          retention-days: 7
